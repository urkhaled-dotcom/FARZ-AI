name: Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android_build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.farz --project-name farz_app .
          fi

      - name: Install FARZ Android inference bridge
        run: python ../scripts/prepare_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Verify the checked-out inference bridge
        run: |
          echo "Commit: $GITHUB_SHA"
          sed -n '18,30p' lib/services/farz_inference_service.dart
          if grep -q "const FileSystemException" lib/services/farz_inference_service.dart; then
            echo "Stale inference service source was checked out."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farz-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
