name: Android APK build

concurrency:
  group: farz-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/prepare_android.py'
      - 'ml/src/export/export_onnx.py'
      - '.github/workflows/android_build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.farz --project-name farz_app .
          fi

      - name: Install FARZ Android inference bridge and branding
        run: python ../scripts/prepare_android.py

      - name: Verify FARZ package configuration
        run: |
          set -euo pipefail
          test -s assets/models/farz_model.onnx
          grep -F 'abiFilters += setOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")' android/app/build.gradle.kts
          grep -F 'implementation("com.microsoft.onnxruntime:onnxruntime-android:1.31.1")' android/app/build.gradle.kts
          grep -F 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
          grep -F '<string name="app_name">FARZ | فرز</string>' android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Verify the checked-out inference bridge
        run: |
          echo "Commit: $GITHUB_SHA"
          grep -F 'models/farz_model.onnx' android/app/src/main/kotlin/com/farz/farz_app/FarzClassifier.kt

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build universal APK for ARMv7, ARM64, x86 and x86_64
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x86,android-x64

      - name: Verify APK contains model and three native runtimes
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/models/farz_model.onnx'
          unzip -l "$APK" | grep -F 'lib/armeabi-v7a/libonnxruntime.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libonnxruntime.so'
          unzip -l "$APK" | grep -F 'lib/x86/libonnxruntime.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libonnxruntime.so'
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E "application-label:|application-icon"
          fi
          echo "APK contains ONNX model, all four native runtimes and FARZ branding."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farz-android-universal-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Free runner disk space before emulator setup
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /

      - name: Smoke test release APK on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop com.farz.farz_app
            adb shell monkey -p com.farz.farz_app 1
            sleep 15
            if ! adb shell pidof com.farz.farz_app >/dev/null; then
              echo "FARZ process exited during startup."
              adb logcat -d -t 4000
              exit 1
            fi
            echo "FARZ installed and remained running on Android API 29."
