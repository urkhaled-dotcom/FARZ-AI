name: Android APK build

concurrency:
  group: farz-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android_build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.farz --project-name farz_app .
          fi

      - name: Install FARZ Android inference bridge and branding
        run: python ../scripts/prepare_android.py

      - name: Verify FARZ package configuration
        run: |
          set -euo pipefail
          test -s assets/models/farz_model.pte
          grep -F 'abiFilters += setOf("arm64-v8a", "x86_64")' android/app/build.gradle.kts
          grep -F 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
          grep -F '<string name="app_name">FARZ | فرز</string>' android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Verify the checked-out inference bridge
        run: |
          echo "Commit: $GITHUB_SHA"
          sed -n '18,30p' lib/services/farz_inference_service.dart
          if grep -q "const FileSystemException" lib/services/farz_inference_service.dart; then
            echo "Stale inference service source was checked out."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Verify APK contains model, runtimes, label and launcher resources
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/models/farz_model.pte'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libexecutorch.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libexecutorch.so'
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "Unsupported 32-bit ARM libraries were packaged."
            exit 1
          fi
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E "application-label:|application-icon"
          fi
          echo "APK contains the model, native runtimes and FARZ launcher resources."

      # Upload before the optional emulator smoke test so the APK remains
      # available for inspection even if the hosted runner cannot fit an AVD.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farz-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Free runner disk space before emulator setup
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h /
          # The NDK and CMake are only needed while building. Remove them after
          # the APK is complete so the Android emulator image can be installed.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /

      - name: Smoke test release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop com.farz.farz_app
            adb shell monkey -p com.farz.farz_app 1
            sleep 15
            if ! adb shell pidof com.farz.farz_app >/dev/null; then
              echo "FARZ process exited during startup."
              adb logcat -d -t 4000
              exit 1
            fi
            echo "FARZ launcher smoke test passed on Android API 35 x86_64."
