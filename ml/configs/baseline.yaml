project: FARZ
seed: 42
image:
  size: 224
  channels: 3
classes:
  - Glass
  - Paper
  - Cardboard
  - Plastic
  - Metal
data:
  manifest: data/manifests/training_candidate_manifest.csv
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
training:
  framework: pytorch
  primary_model: mobilenet_v3_small
  baseline_model: resnet18
  batch_size: 32
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5
evaluation:
  metrics: [accuracy, macro_precision, macro_recall, macro_f1]
export:
  target_runtime: executorch
  input_layout: NCHW
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
