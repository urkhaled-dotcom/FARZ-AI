name: farz_app
description: FARZ — offline waste material classification app.
publish_to: 'none'
version: 0.3.3+6

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/farz_logo.svg
    - assets/brand/farz_app_icon.svg
